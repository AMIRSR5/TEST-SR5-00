  $('#sg').innerHTML=sk.map((k,i)=>`<div class="card rv" style="--w:${+k.level||0}%"><div class="no"><span>${fd(String(i+1).padStart(2,'0'))} / ${fd(String(sk.length).padStart(2,'0'))}</span></div><div class="ic">${k.icon_url?`<img src="${esc(k.icon_url)}" alt="">`:esc(String(k.name).charAt(0).toUpperCase())}</div><div class="big">${fd(+k.level||0)}%</div><div class="lb">${esc(String(k.name).toUpperCase())} · ${t('lv')}</div><div class="pb"><i></i></div></div>`).join('');
  // projects
  const pr=(D.projects&&D.projects.length)?D.projects:[{title:'CYBER GYM',subtitle:'وب اپ تمرین هوشمند',description:'یک وب‌اپلیکیشن پیشرفته فارسی برای ردیابی تمرینات بدنسازی؛ سایبرپانک، آفلاین و قابل نصب روی اندروید.',icon_url:'icon.png',demo_url:'https://amirsr5.github.io/CYBER-GYM-PUBLIC-/'}];
  $('#ag').innerHTML=pr.map(p=>{let h='';try{h=new URL(p.demo_url).host}catch(e){h='amirhooseinsarafraz.ir'}
    return `<div class="frame rv"><div class="fbar"><i></i><i></i><i></i><span class="url">${esc(h)}</span></div><div class="fb"><h3><span class="ic"><img src="${esc(p.icon_url||'icon.png')}" alt="" onerror="this.src='icon.png'"></span><span>${esc(pick(p,'title')||p.title)}</span></h3><p><b>${esc(pick(p,'subtitle')||p.subtitle||'')}</b><br>${esc(pick(p,'description')||p.description||'')}</p>${(p.technologies&&p.technologies.length)?`<div class="tags">${p.technologies.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${p.demo_url?`<a class="lk" target="_blank" rel="noopener" href="${esc(p.demo_url)}">▶ ${t('open')}</a>`:''}${p.apk_url?`<a class="lk o" target="_blank" rel="noopener" href="${esc(p.apk_url)}">⬇ ${t('apk')}</a>`:''}</div></div>`}).join('');
  // about
  $('#at').innerHTML='<p>'+(L=='fa'?(s.about||t('about')):(s.about_en||t('about')))+'</p>';
  $('#as').innerHTML=[[s.projects_count||'+10','st1'],[s.experience||'2','st2'],[s.age||'20','st3']].map(a=>`<div class="card"><div class="big">${fd(a[0])}</div><div class="lb">${t(a[1])}</div></div>`).join('');
  const v=s.about_video_url;if(v){const yt=v.match(/(?:youtu\.be\/|v=)([\w-]{6,})/);$('#av').innerHTML=yt?`<iframe class="vid" style="aspect-ratio:16/9" src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`:(/aparat/.test(v)?`<iframe class="vid" style="aspect-ratio:16/9" src="${esc(v)}" allowfullscreen></iframe>`:`<video class="vid" controls src="${esc(v)}"></video>`)}
  // contact
  const ph=s.phone||'09037241969',em=s.contact_email||'SA0AR0A0@GMAIL.COM',ig=s.instagram||'SALAR_SARAFRAZ',tg=s.telegram||'SALAR_SR5';
  const B=(h,x,o)=>`<a class="lk${o?' o':''}" target="_blank" rel="noopener" href="${esc(h)}">${x}</a>`;
  $('#cg').innerHTML=[['ph',ph,B('tel:'+ph,t('call'))+B('sms:'+ph,t('sms'),1)],['em',em,B('mailto:'+em,t('send'))],['ig','@'+ig,B('https://instagram.com/'+ig,t('prof'))+B('https://ig.me/m/'+ig,'DM',1)],['tg','@'+tg,B('https://t.me/'+tg,t('send'))]]
    .map(r=>`<div class="row rv"><span class="lb">${t(r[0])}</span><b>${esc(r[1])}</b><span>${r[2]}</span></div>`).join('');
  // gallery
  const g=(D.gallery||[]).map(x=>x.url).filter(Boolean);clearInterval(render.gt);
  if(g.length){let i=0;const im=$('#p1');im.src=g[0];if(g.length>1)render.gt=setInterval(()=>{i=(i+1)%g.length;im.style.opacity=0;setTimeout(()=>{im.src=g[i];im.style.opacity=1},500)},4500)}
  reveal();
}
let io;function reveal(){io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});$$('.rv:not(.in)').forEach(e=>io.observe(e))}

// ---- data: GitHub-published data.json first (same origin), Supabase only as fallback ----
async function load(){
  try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(r.ok){D=await r.json();return}}catch(e){}
  try{
    await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const sb=supabase.createClient(SB_URL,SB_KEY),q=async x=>(await x).data;
    const [a,b,c,d,e]=await Promise.all([q(sb.from('site_settings').select('*').eq('id',1).limit(1)),q(sb.from('skills').select('*').order('sort_order')),q(sb.from('projects').select('*').eq('status','published').order('sort_order')),q(sb.from('gallery_photos').select('*').order('sort_order')),q(sb.from('site_music').select('*').eq('id',1).limit(1))]);
    D={settings:(a||[])[0]||{},skills:b||[],projects:c||[],gallery:d||[],music:(e||[])[0]||null};
  }catch(e){D={}}
}

// ---- hero: scroll-scrubbed video (laptop vs phone file) ----
const hv=$('#hv'),mob=matchMedia('(max-width:820px),(orientation:portrait)').matches;
hv.src=mob?'scroll-mobile.mp4':'scroll-desktop.mp4';hv.load();
hv.addEventListener('loadedmetadata',()=>{hv.play().then(()=>hv.pause()).catch(()=>{})});
let cur=0,tgt=0;
function onScroll(){
  const r=$('#home').getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));tgt=p;
  $('#ht').style.opacity=Math.max(0,1-p*2.4);const q=Math.min(1,Math.max(0,(p-.55)*3));$('#hp').style.opacity=q;$('#hp').style.transform=`translateY(${(1-q)*30}px)`;
  $('#bar').style.transform=`scaleX(${scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)})`;
}
(function loop(){cur+=(tgt-cur)*.16;const d=hv.duration;if(d&&!hv.seeking){const x=Math.min(cur*d,d-.05);if(Math.abs(hv.currentTime-x)>.015)hv.currentTime=x}requestAnimationFrame(loop)})();
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);

// ---- ui ----
$('#lang').onclick=()=>{L=L=='fa'?'en':'fa';localStorage.setItem('lang',L);render()};
$('#mb').onclick=()=>$('#nv').classList.toggle('open');$$('#nv a').forEach(a=>a.onclick=()=>$('#nv').classList.remove('open'));
function music(){const m=D.music;if(!m||!m.url)return;const a=$('#bgm');a.src=m.url;a.muted=true;a.play().catch(()=>{});setTimeout(()=>$('#mp').classList.add('show'),1500);
  $('#my').onclick=()=>{a.muted=false;a.play().catch(()=>{});$('#mp').classList.remove('show')};$('#mn').onclick=()=>$('#mp').classList.remove('show')}
render();onScroll();load().then(()=>{render();music()});
</script>
