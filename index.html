  }
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  } catch(e) {
    showError('خطا در اتصال به Supabase: ' + e.message);
    return false;
  }
}

// ============================================================
// Check if already logged in
// ============================================================
async function checkSession() {
  if (!initSupabase()) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      parent.postMessage('adm-dash','*');
    }
  } catch(e) {
    console.log('Session check:', e.message);
  }
}

// ============================================================
// Login handler
// ============================================================
async function handleLogin() {
  if (!supabaseClient) {
    if (!initSupabase()) {
      showError('Supabase پیکربندی نشده. فایل config.js را بررسی کنید.');
      return;
    }
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showError('لطفاً ایمیل و رمز عبور را وارد کنید.');
    return;
  }

  setLoading(true);
  hideAlerts();

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      if (error.message.includes('Invalid login')) {
        showError('ایمیل یا رمز عبور اشتباه است.');
      } else {
        showError('خطا: ' + error.message);
      }
      setLoading(false);
      return;
    }

    if (data?.session) {
      showSuccess('ورود موفق — در حال انتقال...');
      setTimeout(() => {
        parent.postMessage('adm-dash','*');
      }, 800);
    }
  } catch(e) {
    showError('خطای شبکه: ' + e.message);
    setLoading(false);
  }
}

// ============================================================
// UI Helpers
// ============================================================
function setLoading(on) {
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');
  const text = document.getElementById('btnText');
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  text.textContent = on ? 'در حال ورود...' : 'ورود به پنل';
}

function showError(msg) {
  const el = document.getElementById('errorAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function showSuccess(msg) {
  const el = document.getElementById('successAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideAlerts() {
  document.getElementById('errorAlert').style.display = 'none';
  document.getElementById('successAlert').style.display = 'none';
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

// ============================================================
// Particles
// ============================================================
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const s = document.createElement('span');
  s.style.left = Math.random() * 100 + '%';
  s.style.animationDuration = (Math.random() * 8 + 6) + 's';
  s.style.animationDelay = (Math.random() * 8) + 's';
  container.appendChild(s);
}

// Init — load config.js dynamically first (cache-proof), then start.
// Using createElement + onload guarantees config.js has fully executed
// before checkSession()/initSupabase() ever run, regardless of any
// document.write timing quirks in the browser.
checkSession();
<\/script>

}

.btn{
  padding:9px 20px;border-radius:6px;

/* Toast */
.toast-wrap{
  position:fixed;bottom:2rem;left:2rem;
  display:flex;flex-direction:column;gap:8px;
  z-index:9999;
}
.toast{
  background:var(--dark2);
  border-radius:8px;padding:12px 16px;
  font-size:13px;border-left:3px solid var(--gold);
  box-shadow:0 8px 24px rgba(0,0,0,0.4);

}
.toast.success{border-left-color:var(--green);color:#86efac}
.toast.error{border-left-color:var(--red);color:#fca5a5}
@keyframes toastIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.05)}
th{color:var(--text-muted);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase}
td{color:var(--text)}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{
  display:inline-block;
  padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;
}
.badge-green{background:rgba(34,197,94,0.15);color:#86efac}
.badge-gray{background:rgba(255,255,255,0.08);color:var(--text-muted)}
.badge-gold{background:rgba(201,168,76,0.15);color:var(--gold)}

/* Loading */
.loading{
  text-align:center;padding:3rem;
  color:var(--text-muted);font-size:14px;
}
.spinner-lg{
  width:30px;height:30px;
  border:3px solid rgba(201,168,76,0.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 1rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Skills grid */
.skills-edit{display:grid;gap:8px}
.skill-row{
  display:flex;align-items:center;gap:8px;
}
.skill-row input[type=text]{flex:1}
.skill-row input[type=range]{flex:1;accent-color:var(--gold)}
.skill-pct{width:36px;font-size:13px;color:var(--gold)}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gallery-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(201,168,76,0.2);background:rgba(255,255,255,0.03);aspect-ratio:3/4}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-item .g-order{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.65);color:var(--gold);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.gallery-item .g-actions{position:absolute;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent)}

.gallery-item .g-actions button:hover{background:rgba(255,255,255,0.18)}
.gallery-item .g-actions button.g-del{background:rgba(239,68,68,0.2);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.gallery-item .g-actions button.g-del:hover{background:rgba(239,68,68,0.35)}
.gallery-empty{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:2rem;font-size:13px}

.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.anim-card{border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:rgba(255,255,255,0.02);transition:border-color .2s}
.anim-card:hover{border-color:rgba(201,168,76,0.4)}
.anim-card.selected{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.anim-demo-box{width:100%;height:60px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;opacity:1}
.anim-card-label{font-size:12px;color:var(--text)}
.anim-card.selected .anim-card-label{color:var(--gold);font-weight:700}

/* demo playback states — mirror the 10 site presets */
.anim-demo-box.play-fade-up{animation:demoFadeUp .7s ease}
@keyframes demoFadeUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
.anim-demo-box.play-fade-in{animation:demoFadeIn .8s ease}
@keyframes demoFadeIn{0%{opacity:0}100%{opacity:1}}
.anim-demo-box.play-zoom-in{animation:demoZoomIn .6s ease}
@keyframes demoZoomIn{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.anim-demo-box.play-slide-left{animation:demoSlideLeft .6s ease}
@keyframes demoSlideLeft{0%{opacity:0;transform:translateX(35px)}100%{opacity:1;transform:translateX(0)}}
.anim-demo-box.play-slide-right{animation:demoSlideRight .6s ease}
@keyframes demoSlideRight{0%{opacity:0;transform:translateX(-35px)}100%{opacity:1;transform:translateX(0)}}
.anim-demo-box.play-blur-in{animation:demoBlurIn .7s ease}
@keyframes demoBlurIn{0%{opacity:0;filter:blur(10px)}100%{opacity:1;filter:blur(0)}}
.anim-demo-box.play-flip-up{animation:demoFlipUp .6s ease}
@keyframes demoFlipUp{0%{opacity:0;transform:perspective(500px) rotateX(50deg)}100%{opacity:1;transform:perspective(500px) rotateX(0)}}
.anim-demo-box.play-glitch-in{animation:demoGlitch .5s steps(2,end)}
@keyframes demoGlitch{0%{opacity:0;transform:translate(-6px,0)}20%{opacity:1;transform:translate(6px,0)}40%{transform:translate(-4px,0)}60%{transform:translate(4px,0)}80%{transform:translate(-2px,0)}100%{transform:translate(0,0)}}
.anim-demo-box.play-bounce-in{animation:demoBounce .5s cubic-bezier(.34,1.8,.64,1)}
@keyframes demoBounce{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.anim-demo-box.play-rotate-in{animation:demoRotate .6s ease}
@keyframes demoRotate{0%{opacity:0;transform:rotate(-20deg) scale(.85)}100%{opacity:1;transform:rotate(0) scale(1)}}

.conv-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,0.02)}
.conv-row:hover{background:rgba(201,168,76,0.08)}
.conv-row.unread{border-color:rgba(201,168,76,0.5);background:rgba(201,168,76,0.06)}
.conv-name{font-weight:700;font-size:14px}
.conv-phone{font-size:12px;color:var(--text-muted);direction:ltr;text-align:right}
.conv-time{font-size:11px;color:var(--text-muted)}
.conv-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-left:6px}

.chat-thread-overlay{position:fixed;inset:0;background:#050805;z-index:5000;display:none;flex-direction:column;font-family:'Courier New',monospace}
.chat-thread-overlay.show{display:flex}
.chat-thread-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0a0f0a;border-bottom:1px solid rgba(0,255,120,0.15)}
.chat-thread-header .btn{margin:0}
.chat-thread-title{color:var(--gold);font-weight:700;font-size:14px}
.chat-thread-sub{color:#5fff9f;font-size:11px;margin-top:2px;direction:ltr;text-align:right}
.chat-thread-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
.chat-msg-row{display:flex;touch-action:pan-y}
.chat-msg-row.admin{justify-content:flex-end}
.chat-msg-row.visitor{justify-content:flex-start}
.chat-swipe-reply-icon{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);color:#5fe89a;display:flex;align-items:center;justify-content:center;font-size:12px;align-self:center;opacity:0;transition:opacity .15s;flex-shrink:0;margin:0 6px}
.chat-msg-row.swiping .chat-swipe-reply-icon{opacity:1}
.chat-msg{max-width:78%;padding:9px 13px 7px;border-radius:14px;font-size:13.5px;line-height:1.65;word-wrap:break-word;position:relative;font-family:'Vazirmatn',sans-serif;cursor:grab;transition:transform .15s ease}
.chat-msg.admin{background:linear-gradient(135deg,rgba(80,220,150,.35),rgba(40,150,100,.35));color:#eafff2;border-bottom-left-radius:4px}
.chat-msg.visitor{background:rgba(255,255,255,.08);color:#f0f0f0;border-bottom-right-radius:4px}
.chat-msg img,.chat-msg video{max-width:100%;border-radius:8px;display:block;margin-top:4px}
.chat-msg audio{width:220px;margin-top:4px}
.chat-msg-time{font-size:9.5px;opacity:.65;margin-top:3px;direction:ltr;text-align:left}
.chat-thread-input{display:flex;align-items:center;gap:6px;padding:10px;background:#0a0f0a;border-top:1px solid rgba(0,255,120,0.15)}
.chat-thread-input input[type=text]{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:9px 14px;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:13px}
.chat-thread-input button{background:none;border:none;color:#5fff9f;font-size:18px;cursor:pointer}
.chat-thread-input .send{background:var(--gold);color:#000;border-radius:50%;width:34px;height:34px;flex-shrink:0;font-size:15px}

@media(max-width:768px){
  .sidebar{transform:translateX(260px)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .overlay.show{display:block}
  .main{margin-right:0;padding:1rem;padding-top:4rem}
  .form-row{grid-template-columns:1fr}
  .cards-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">☰</button>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<\!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="../icon.png" alt="SR5" class="sidebar-logo" onerror="this.style.display='none'">
    <div>
      <div class="sidebar-title">AMIR_SR5</div>

  </div>

  <div class="nav-section">منو</div>
  <a class="nav-item active" onclick="showPage('dashboard')" href="#">

  </a>

  </a>
  <a class="nav-item" onclick="showPage('music')" href="#">

  </a>
  <a class="nav-item" onclick="showPage('chat')" href="#">
    <span class="nav-icon">💬</span> چت آنلاین
  </a>
  <a class="nav-item" onclick="showPage('animations')" href="#">
    <span class="nav-icon">✨</span> انیمیشن ورود
  </a>
  <a class="nav-item" onclick="showPage('skills')" href="#">
    <span class="nav-icon">⚡</span> مهارت‌ها
  </a>
  <a class="nav-item" onclick="showPage('projects')" href="#">
    <span class="nav-icon">🚀</span> پروژه‌ها
  </a>
  <a class="nav-item" onclick="showPage('blog')" href="#">
    <span class="nav-icon">📝</span> بلاگ
  </a>

  <div class="nav-section">سایت</div>

    <button class="btn-logout" onclick="handleLogout()">🚪 خروج</button>
  </div>
</div>

<\!-- MAIN -->
<div class="main">

  <\!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="page-title">داشبورد</div>
    <div class="page-sub">خلاصه وضعیت سایت</div>
    <div class="cards-row">
      <div class="stat-card">
        <div class="icon">🚀</div>
        <div class="num" id="stat-projects">—</div>
        <div class="label">پروژه</div>
      </div>
      <div class="stat-card">
        <div class="icon">📝</div>
        <div class="num" id="stat-posts">—</div>
        <div class="label">مقاله</div>
      </div>
      <div class="stat-card">
        <div class="icon">✅</div>
        <div class="num" id="stat-published">—</div>
        <div class="label">منتشرشده</div>
      </div>
      <div class="stat-card">
        <div class="icon">✏️</div>
        <div class="num" id="stat-drafts">—</div>
        <div class="label">پیش‌نویس</div>
      </div>
    </div>
    <div class="section-card">
      <h3>وضعیت سیستم</h3>
      <p style="color:var(--text-muted);font-size:13px;line-height:1.8">
        ✅ ورود موفق<br>
        ✅ اتصال به Supabase برقرار<br>
        ✅ Session فعال<br>
        <span id="db-status">⏳ در حال بررسی Database...</span>
      </p>
    </div>
  </div>

  <\!-- SETTINGS -->
  <div class="page" id="page-settings">
    <div class="page-title">اطلاعات شخصی</div>
    <div class="page-sub">مدیریت اطلاعات About و Hero</div>
    <div class="section-card">
      <h3>اطلاعات اصلی</h3>
      <div class="form-row">
        <div class="form-group">
          <label>نام کامل</label>
          <input type="text" id="s-name" placeholder="امیرحسین سرافراز">
        </div>
        <div class="form-group">
          <label>نام نمایشی / Alias</label>
          <input type="text" id="s-alias" placeholder="AMIR_SR5">
        </div>
      </div>
      <div class="form-group">
        <label>عنوان حرفه‌ای</label>
        <input type="text" id="s-title" placeholder="Full-Stack Developer & PWA Specialist">
      </div>
      <div class="form-group">
        <label>توضیح کوتاه (Hero)</label>
        <textarea id="s-hero-desc" placeholder="جمله کوتاه زیر نام در صفحه اصلی"></textarea>
      </div>
      <div class="form-group">
        <label>درباره من (About)</label>
        <textarea id="s-about" style="min-height:120px" placeholder="متن بخش About Me..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>تعداد پروژه‌های فعال</label>
          <input type="text" id="s-projects-count" placeholder="+۱۰">
        </div>
        <div class="form-group">
          <label>سال‌های سابقه</label>
          <input type="text" id="s-exp" placeholder="۲">
        </div>
        <div class="form-group">
          <label>سن</label>
          <input type="text" id="s-age" placeholder="۲۰">
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره</button>
    </div>
  </div>

  <\!-- CONTACT -->
  <div class="page" id="page-contact">
    <div class="page-title">اطلاعات تماس</div>
    <div class="page-sub">مدیریت راه‌های ارتباطی</div>
    <div class="section-card">
      <h3>اطلاعات تماس</h3>
      <div class="form-row">
        <div class="form-group">
          <label>شماره تماس</label>
          <input type="text" id="c-phone" placeholder="09037241969" dir="ltr">
        </div>
        <div class="form-group">
          <label>ایمیل</label>
          <input type="email" id="c-email" placeholder="admin@example.com" dir="ltr">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>اینستاگرام (بدون @)</label>
          <input type="text" id="c-instagram" placeholder="SALAR_SARAFRAZ" dir="ltr">
        </div>
        <div class="form-group">
          <label>تلگرام (بدون @)</label>
          <input type="text" id="c-telegram" placeholder="SALAR_SR5" dir="ltr">
        </div>
      </div>
      <div class="form-group">
        <label>گیتهاب (username)</label>
        <input type="text" id="c-github" placeholder="AMIRSR5" dir="ltr">
      </div>
      <button class="btn btn-primary" onclick="saveContact()">💾 ذخیره</button>
    </div>
  </div>

  <\!-- SKILLS -->
  <div class="page" id="page-skills">
    <div class="page-title">مهارت‌ها</div>
    <div class="page-sub">مدیریت Skills سایت</div>
    <div class="section-card">
      <h3>مهارت‌ها</h3>
      <div class="skills-edit" id="skills-list">
        <div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div>
      </div>
      <div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="addSkillRow()">+ افزودن مهارت</button>
        <button class="btn btn-primary" onclick="saveSkills()">💾 ذخیره همه</button>
      </div>
    </div>
  </div>

  <\!-- GALLERY -->
  <div class="page" id="page-gallery">
    <div class="page-title">عکس‌های من</div>
    <div class="page-sub">این عکس‌ها به‌صورت اسلایدشوی خودکار در بخش About سایت نمایش داده می‌شن</div>
    <div class="section-card">
      <h3>افزودن عکس</h3>
      <div class="form-group">
        <label>یک یا چند عکس انتخاب کن (JPG / PNG / WebP)</label>
        <input type="file" id="gallery-file-input" accept="image/*" multiple onchange="handleGalleryUpload(this.files)">
      </div>
      <div id="gallery-upload-status" style="font-size:13px;color:var(--text-muted)"></div>
    </div>
    <div class="section-card">
      <h3>ترتیب نمایش <span style="font-size:12px;color:var(--text-muted);font-weight:400">(بالا رفتن = اول اسلایدشو)</span></h3>
      <div class="gallery-grid" id="gallery-grid">
        <div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div>
      </div>
    </div>
  </div>

  <\!-- MUSIC -->
  <div class="page" id="page-music">
    <div class="page-title">موزیک پس‌زمینه</div>
    <div class="page-sub">وقتی کاربر وارد سایت می‌شه، یه کادر کوچیک ازش می‌پرسه صدا پخش بشه یا نه — خودِ موزیک بی‌صدا و خودکار از قبل آماده‌ست</div>
    <div class="section-card">
      <h3>وضعیت فعلی</h3>
      <div id="music-current"><div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div></div>
    </div>
    <div class="section-card">
      <h3>آپلود / جایگزینی موزیک</h3>
      <div class="form-group">
        <label>یک فایل صوتی انتخاب کن (MP3 / M4A / OGG — حداکثر چند مگابایت، برای لود سریع سایت)</label>
        <input type="file" id="music-file-input" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.wma,.opus" onchange="handleMusicUpload(this.files)">
      </div>
      <div id="music-upload-status" style="font-size:13px;color:var(--text-muted)"></div>
    </div>
  </div>

  <\!-- CHAT -->
  <div class="page" id="page-chat">
    <div class="page-title">چت آنلاین</div>
    <div class="page-sub">لیست گفتگوهایی که کاربران تو سایت باهات شروع کردن</div>
    <div class="section-card">
      <div id="chat-conv-list"><div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div></div>
    </div>
  </div>

  <\!-- ANIMATIONS -->
  <div class="page" id="page-animations">
    <div class="page-title">انیمیشن ورود</div>
    <div class="page-sub">رو هر کارت بزن تا پیش‌نمایشش رو ببینی، بعد همونی که خوشت اومد رو انتخاب و ذخیره کن</div>
    <div class="section-card">
      <div class="anim-grid" id="anim-grid"></div>
      <button class="btn btn-primary" style="margin-top:1.25rem;width:100%" onclick="saveAnimSetting()">✅ ذخیره و اعمال روی سایت</button>
      <div id="anim-save-status" style="font-size:13px;color:var(--text-muted);margin-top:8px;text-align:center"></div>
    </div>
  </div>

  <\!-- PROJECTS -->
  <div class="page" id="page-projects">
    <div class="page-title">پروژه‌ها</div>
    <div class="page-sub">مدیریت نمونه‌کارها</div>
    <div style="margin-bottom:1rem">
      <button class="btn btn-primary" onclick="showAddProject()">+ پروژه جدید</button>
    </div>
    <div class="section-card">
      <div id="projects-table">
        <div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div>
      </div>
    </div>

    <\!-- Add/Edit Project Form -->
    <div class="section-card" id="project-form" style="display:none">
      <h3 id="project-form-title">پروژه جدید</h3>
      <input type="hidden" id="p-id">
      <div class="form-row">
        <div class="form-group">
          <label>عنوان پروژه</label>
          <input type="text" id="p-title" placeholder="CYBER GYM">
        </div>
        <div class="form-group">
          <label>زیرعنوان</label>
          <input type="text" id="p-subtitle" placeholder="وب اپ تمرین هوشمند">
        </div>
      </div>
      <div class="form-group">
        <label>توضیحات</label>
        <textarea id="p-desc" style="min-height:100px"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>لینک وب‌اپ</label>
          <input type="url" id="p-url" placeholder="https://..." dir="ltr">
        </div>
        <div class="form-group">
          <label>لینک دانلود APK (اختیاری)</label>
          <input type="url" id="p-apk" placeholder="https://..." dir="ltr">
        </div>
      </div>
      <div class="form-group">
        <label>تکنولوژی‌ها (با کاما جدا کن)</label>
        <input type="text" id="p-tech" placeholder="React, JavaScript, PWA" dir="ltr">
      </div>
      <div class="form-group">
        <label>وضعیت</label>
        <select id="p-status">
          <option value="published">منتشرشده</option>
          <option value="draft">مخفی</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="saveProject()">💾 ذخیره</button>
        <button class="btn btn-ghost" onclick="cancelProject()">انصراف</button>
      </div>
    </div>
  </div>

  <\!-- BLOG -->
  <div class="page" id="page-blog">
    <div class="page-title">بلاگ</div>
    <div class="page-sub">مدیریت مقالات</div>
    <div style="margin-bottom:1rem">
      <button class="btn btn-primary" onclick="showAddPost()">+ مقاله جدید</button>
    </div>

    <\!-- Posts list -->
    <div class="section-card" id="posts-list-section">
      <div id="posts-table">
        <div class="loading"><div class="spinner-lg"></div>در حال بارگذاری...</div>
      </div>
    </div>

    <\!-- Editor -->
    <div id="post-editor" style="display:none">
      <div class="section-card">
        <h3 id="editor-title">مقاله جدید</h3>
        <input type="hidden" id="post-id">
        <div class="form-group">
          <label>عنوان مقاله</label>
          <input type="text" id="post-title" placeholder="عنوان مقاله...">
        </div>
        <div class="form-group">
          <label>Slug (URL)</label>
          <input type="text" id="post-slug" placeholder="my-article-slug" dir="ltr">
        </div>
        <div class="form-group">
          <label>خلاصه (Excerpt)</label>
          <textarea id="post-excerpt" style="min-height:70px" placeholder="خلاصه مقاله..."></textarea>
        </div>
        <div class="form-group">
          <label>محتوا (HTML پشتیبانی می‌شود)</label>
          <div style="border:1px solid rgba(201,168,76,0.2);border-radius:8px;overflow:hidden">
            <\!-- Editor toolbar -->
            <div style="padding:8px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="fmt('bold')"><b>B</b></button>
              <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="fmt('italic')"><i>I</i></button>
              <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="insertTag('h2')">H2</button>
              <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="insertTag('h3')">H3</button>

<\script>
// ============================================================
// INIT
// ============================================================
let sb = null;
let currentUser = null;
let skillsData = [];
let projectsData = [];
let postsData = [];

// Global error visibility — since this panel is often checked from
// a phone with no dev console, surface any uncaught JS error as a toast
// so it can be screenshotted and reported.
window.addEventListener('error', function (ev) {
  console.error('Uncaught error:', ev.error || ev.message);
  try { toast('⚠️ خطای جاوااسکریپت: ' + (ev.message || 'نامشخص'), 'error'); } catch (_) {}
});
window.addEventListener('unhandledrejection', function (ev) {
  console.error('Unhandled promise rejection:', ev.reason);
  try {
    const msg = (ev.reason && (ev.reason.message || JSON.stringify(ev.reason))) || 'نامشخص';
    toast('⚠️ خطای async: ' + msg, 'error');
  } catch (_) {}
});

function initSupabase() {
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    fetch('config.js?debug=' + Date.now())
      .then(r => r.text().then(t => `status ${r.status} ${r.ok ? 'OK' : 'FAIL'} — first 80 chars: ${t.slice(0, 80)}`))
      .catch(e => 'fetch error: ' + e.message)
      .then(info => alert('config.js تنظیم نشده!\n\nDebug:\n' + info));
    return false;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}

// ============================================================
// Auth Guard — اگر لاگین نبود برگرد به login
// ============================================================
async function authGuard() {
  if (!initSupabase()) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    parent.postMessage('adm-login','*');
    return;
  }
  currentUser = session.user;
  document.getElementById('adminEmail').textContent = '👤 ' + currentUser.email;

  // Listen for auth changes
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      parent.postMessage('adm-login','*');
    }
  });

  // Load initial data
  await loadDashboard();
}

// ============================================================
// LOGOUT
// ============================================================
async function handleLogout() {
  if (!confirm('آیا از پنل خارج می‌شوید؟')) return;
  await sb.auth.signOut();
  parent.postMessage('adm-login','*');
}

// ============================================================
// NAVIGATION
// ============================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  closeSidebar();

  if (name === 'skills') loadSkills();
  if (name === 'gallery') loadGallery();
  if (name === 'music') loadMusic();
  if (name === 'chat') loadChatConversations();
  if (name === 'animations') loadAnimSetting();
  if (name === 'projects') loadProjects();
  if (name === 'blog') loadPosts();
  if (name === 'settings') loadSiteSettings();
  if (name === 'contact') loadContact();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type='success') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDashboard() {
  try {
    // Try to get counts - these tables might not exist yet
    const results = await Promise.allSettled([
      sb.from('projects').select('*', { count: 'exact', head: true }),
      sb.from('blog_posts').select('*', { count: 'exact', head: true }),
      sb.from('blog_posts').select('*', { count: 'exact', head: true }).eq('status', 'published'),
      sb.from('blog_posts').select('*', { count: 'exact', head: true }).eq('status', 'draft'),
    ]);

    results.forEach((r, i) => {
      if (r.status === 'rejected') console.error('dashboard query', i, 'failed:', r.reason);
      else if (r.value?.error) console.error('dashboard query', i, 'error:', r.value.error);
    });

    document.getElementById('stat-projects').textContent = results[0].value?.count ?? '—';
    document.getElementById('stat-posts').textContent = results[1].value?.count ?? '—';
    document.getElementById('stat-published').textContent = results[2].value?.count ?? '—';
    document.getElementById('stat-drafts').textContent = results[3].value?.count ?? '—';

    const anyFailed = results.some(r => r.status === 'rejected' || r.value?.error);
    document.getElementById('db-status').textContent = anyFailed
      ? '⚠️ بعضی جداول در دسترس نیستن (کنسول رو چک کن)'
      : '✅ Database متصل است';
  } catch (e) {
    console.error('loadDashboard fatal error:', e);
    document.getElementById('db-status').textContent = '⚠️ خطا: ' + (e.message || 'نامشخص');
  }
}

// Safety net: if for any reason loadDashboard() never finishes updating
// this text (e.g. it never even got called), don't leave it spinning forever.
setTimeout(() => {
  const el = document.getElementById('db-status');
  if (el && el.textContent.indexOf('در حال بررسی') !== -1) {
    el.textContent = '⚠️ بارگذاری کامل نشد — صفحه رو رفرش کن';
  }
}, 8000);

// ============================================================
// SITE SETTINGS
// ============================================================
async function loadSiteSettings() {
  try {
    const { data } = await sb.from('site_settings').select('*').single();
    if (data) {
      document.getElementById('s-name').value = data.name || '';
      document.getElementById('s-alias').value = data.alias || '';
      document.getElementById('s-title').value = data.title || '';
      document.getElementById('s-hero-desc').value = data.hero_desc || '';
      document.getElementById('s-about').value = data.about || '';
      document.getElementById('s-projects-count').value = data.projects_count || '';
      document.getElementById('s-exp').value = data.experience || '';
      document.getElementById('s-age').value = data.age || '';
    }
  } catch(e) { console.log('Settings not loaded:', e.message) }
}

async function saveSettings() {
  const data = {
    name: document.getElementById('s-name').value,
    alias: document.getElementById('s-alias').value,
    title: document.getElementById('s-title').value,
    hero_desc: document.getElementById('s-hero-desc').value,
    about: document.getElementById('s-about').value,
    projects_count: document.getElementById('s-projects-count').value,
    experience: document.getElementById('s-exp').value,
    age: document.getElementById('s-age').value,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('site_settings').upsert({ id: 1, ...data });
  if (error) toast('خطا: ' + error.message, 'error');
  else toast('✅ اطلاعات ذخیره شد');
}

// ============================================================
// CONTACT
// ============================================================
async function loadContact() {
  try {
    const { data } = await sb.from('site_settings').select('*').single();
    if (data) {
      document.getElementById('c-phone').value = data.phone || '';
      document.getElementById('c-email').value = data.contact_email || '';
      document.getElementById('c-instagram').value = data.instagram || '';
      document.getElementById('c-telegram').value = data.telegram || '';
      document.getElementById('c-github').value = data.github || '';
    }
  } catch(e) {}
}

async function saveContact() {
  const data = {
    phone: document.getElementById('c-phone').value,
    contact_email: document.getElementById('c-email').value,
    instagram: document.getElementById('c-instagram').value,
    telegram: document.getElementById('c-telegram').value,
    github: document.getElementById('c-github').value,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('site_settings').upsert({ id: 1, ...data });
  if (error) toast('خطا: ' + error.message, 'error');
  else toast('✅ اطلاعات تماس ذخیره شد');
}

// ============================================================
// SKILLS
// ============================================================
async function loadSkills() {
  const container = document.getElementById('skills-list');
  try {
    const { data } = await sb.from('skills').select('*').order('sort_order');
    skillsData = data || defaultSkills();
    renderSkills();
  } catch(e) {
    skillsData = defaultSkills();
    renderSkills();
  }
}

function defaultSkills() {
  return [
    { id: null, name: 'HTML', level: 92, sort_order: 1 },
    { id: null, name: 'CSS', level: 88, sort_order: 2 },
    { id: null, name: 'JavaScript', level: 85, sort_order: 3 },
    { id: null, name: 'React', level: 80, sort_order: 4 },
    { id: null, name: 'PWA Development', level: 90, sort_order: 5 },
  ];
}

function renderSkills() {
  const container = document.getElementById('skills-list');
  container.innerHTML = '';
  skillsData.forEach((skill, i) => {
    const row = document.createElement('div');
    row.className = 'skill-row';
    row.innerHTML = `
      <input type="text" value="${skill.name}" placeholder="نام مهارت" onchange="skillsData[${i}].name=this.value">
      <input type="range" min="0" max="100" value="${skill.level}" oninput="skillsData[${i}].level=+this.value;this.nextElementSibling.textContent=this.value+'%'">
      <span class="skill-pct">${skill.level}%</span>
      <button class="btn btn-danger" style="padding:6px 10px;font-size:11px" onclick="removeSkill(${i})">حذف</button>
    `;
    container.appendChild(row);
  });
}

function addSkillRow() {
  skillsData.push({ id: null, name: '', level: 80, sort_order: skillsData.length + 1 });
  renderSkills();
}

function removeSkill(i) {
  skillsData.splice(i, 1);
  renderSkills();
}

async function saveSkills() {
  try {
    // Delete all and re-insert
    await sb.from('skills').delete().neq('id', 0);
    const inserts = skillsData.map((s, i) => ({
      name: s.name, level: s.level, sort_order: i + 1
    }));
    const { error } = await sb.from('skills').insert(inserts);
    if (error) throw error;
    toast('✅ مهارت‌ها ذخیره شدند');
  } catch(e) {
    toast('خطا: ' + e.message, 'error');
  }
}

// ============================================================
// GALLERY (عکس‌های اسلایدشو)
// ============================================================
let galleryData = [];
const GALLERY_BUCKET = 'gallery';

async function loadGallery() {
  const grid = document.getElementById('gallery-grid');
  try {
    const { data, error } = await sb.from('gallery_photos').select('*').order('sort_order');
    if (error) throw error;
    galleryData = data || [];
    renderGalleryGrid();
  } catch (e) {
    console.error('loadGallery error:', e);
    grid.innerHTML = `<div class="gallery-empty">⚠️ خطا در خواندن جدول gallery_photos:<br><span dir="ltr" style="font-family:monospace;font-size:12px;color:#fca5a5">${(e && (e.message || e.error_description || JSON.stringify(e))) || 'نامشخص'}</span><br><br>اگه این پیام «relation does not exist» بود یعنی SQL درست اجرا نشده. اگه چیز دیگه‌ای بود (مثلاً permission) به سازنده‌ی سایت نشونش بده.</div>`;
  }
}

function renderGalleryGrid() {
  const grid = document.getElementById('gallery-grid');
  if (!galleryData.length) {
    grid.innerHTML = '<div class="gallery-empty">هنوز عکسی اضافه نکردی. از بالا یک یا چند عکس انتخاب کن.</div>';
    return;
  }
  grid.innerHTML = galleryData.map((photo, i) => `
    <div class="gallery-item">
      <img src="${photo.url}" alt="عکس ${i + 1}" loading="lazy">
      <div class="g-order">${i + 1}</div>
      <div class="g-actions">
        <button onclick="moveGalleryItem(${i}, -1)" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button onclick="moveGalleryItem(${i}, 1)" ${i === galleryData.length - 1 ? 'disabled' : ''}>▼</button>
        <button class="g-del" onclick="deleteGalleryItem(${i})">حذف</button>
      </div>
    </div>
  `).join('');
}

async function moveGalleryItem(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= galleryData.length) return;
  [galleryData[i], galleryData[j]] = [galleryData[j], galleryData[i]];
  renderGalleryGrid();
  try {
    await Promise.all(galleryData.map((p, idx) =>
      sb.from('gallery_photos').update({ sort_order: idx }).eq('id', p.id)
    ));
  } catch (e) {
    toast('خطا در ذخیره ترتیب: ' + e.message, 'error');
  }
}

async function deleteGalleryItem(i) {
  const photo = galleryData[i];
  if (!confirm('این عکس حذف بشه؟')) return;
  try {
    if (photo.path) {
      await sb.storage.from(GALLERY_BUCKET).remove([photo.path]);
    }
    const { error } = await sb.from('gallery_photos').delete().eq('id', photo.id);
    if (error) throw error;
    galleryData.splice(i, 1);
    renderGalleryGrid();
    toast('🗑️ عکس حذف شد');
  } catch (e) {
    toast('خطا: ' + e.message, 'error');
  }
}

async function handleGalleryUpload(files) {
  if (!files || !files.length) return;
  const statusEl = document.getElementById('gallery-upload-status');
  const input = document.getElementById('gallery-file-input');
  let nextOrder = galleryData.length;
  let done = 0, failed = 0;

  for (const file of Array.from(files)) {
    statusEl.textContent = `در حال آپلود ${done + failed + 1} از ${files.length}...`;
    try {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = `photos/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: upErr } = await sb.storage.from(GALLERY_BUCKET).upload(path, file, {
        cacheControl: '3600',
        upsert: false
      });
      if (upErr) throw upErr;

      const { data: pub } = sb.storage.from(GALLERY_BUCKET).getPublicUrl(path);
      const url = pub.publicUrl;

      const { data: inserted, error: insErr } = await sb.from('gallery_photos')
        .insert({ url, path, sort_order: nextOrder })
        .select()
        .single();
      if (insErr) throw insErr;

      galleryData.push(inserted);
      nextOrder++;
      done++;
    } catch (e) {
      failed++;
      console.error(e);
    }
  }

  renderGalleryGrid();
  statusEl.textContent = failed
    ? `✅ ${done} عکس آپلود شد — ⚠️ ${failed} تا ناموفق بود (کنسول رو چک کن)`
    : `✅ ${done} عکس با موفقیت آپلود شد`;
  toast(failed ? 'برخی آپلودها ناموفق بودند' : '✅ عکس‌ها آپلود شدند', failed ? 'error' : 'success');
  input.value = '';
}

// ============================================================
// MUSIC (موزیک پس‌زمینه)
// ============================================================
const MUSIC_BUCKET = 'music';
let currentMusic = null;

async function loadMusic() {
  const box = document.getElementById('music-current');
  try {
    const { data, error } = await sb.from('site_music').select('*').eq('id', 1).single();
    if (error) throw error;
    currentMusic = data;
    renderMusicStatus();
  } catch (e) {
    console.error('loadMusic error:', e);
    box.innerHTML = `<div class="gallery-empty">⚠️ خطا در خواندن جدول site_music:<br><span dir="ltr" style="font-family:monospace;font-size:12px;color:#fca5a5">${(e && e.message) || 'نامشخص'}</span><br><br>اگه جدول ساخته نشده، فایل SETUP.sql رو (نسخه‌ی جدید که موزیک هم توشه) دوباره تو Supabase اجرا کن.</div>`;
  }
}

function renderMusicStatus() {
  const box = document.getElementById('music-current');
  if (!currentMusic || !currentMusic.url) {
    box.innerHTML = '<div class="gallery-empty">هنوز موزیکی آپلود نشده.</div>';
    return;
  }
  box.innerHTML = `
    <audio controls src="${currentMusic.url}" style="width:100%;margin-bottom:12px"></audio>
    <button class="btn btn-danger" onclick="deleteMusic()">🗑️ حذف موزیک</button>
  `;
}

async function handleMusicUpload(files) {
  if (!files || !files.length) return;
  const file = files[0];
  const statusEl = document.getElementById('music-upload-status');
  const input = document.getElementById('music-file-input');

  statusEl.textContent = 'در حال آپلود...';
  try {
    // Remove old file first (if any) so storage doesn't fill up with orphans.
    if (currentMusic && currentMusic.path) {
      await sb.storage.from(MUSIC_BUCKET).remove([currentMusic.path]);
    }

    const ext = (file.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp3';
    const path = `bg/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

    const { error: upErr } = await sb.storage.from(MUSIC_BUCKET).upload(path, file, {
      cacheControl: '3600',
      upsert: false
    });
    if (upErr) throw upErr;

    const { data: pub } = sb.storage.from(MUSIC_BUCKET).getPublicUrl(path);
    const url = pub.publicUrl;

    const { data: updated, error: updErr } = await sb.from('site_music')
      .update({ url, path, updated_at: new Date().toISOString() })
      .eq('id', 1)
      .select()
      .single();
    if (updErr) throw updErr;

    currentMusic = updated;

let adminReplyingTo = null;

function adminSnippetFor(msg) {
  if (msg.msg_type === 'text') return (msg.content || '').slice(0, 60);
  if (msg.msg_type === 'image') return '📷 عکس';
  if (msg.msg_type === 'video') return '🎥 ویدیو';
  if (msg.msg_type === 'audio') return '🎤 ویس';
  return '';
}

window.setAdminReplyTarget = function (msg) {
  adminReplyingTo = { id: msg.id, snippet: adminSnippetFor(msg) };
  document.getElementById('admin-reply-bar-text').textContent = adminReplyingTo.snippet;
  document.getElementById('admin-reply-bar').style.display = 'flex';
  document.getElementById('chat-thread-text-input').focus();
};

window.cancelAdminReply = function () {
  adminReplyingTo = null;
  document.getElementById('admin-reply-bar').style.display = 'none';
};

function renderAdminMsg(msg) {
  const isAdmin = msg.sender === 'admin';
  const row = document.createElement('div');
  row.className = 'chat-msg-row ' + (isAdmin ? 'admin' : 'visitor');

  const replyIcon = document.createElement('span');
  replyIcon.className = 'chat-swipe-reply-icon';
  replyIcon.textContent = '↩';

  const bubble = document.createElement('div');
  bubble.className = 'chat-msg ' + (isAdmin ? 'admin' : 'visitor');
  let inner = '';
  if (msg.reply_to_snippet) {
    inner += `<div class="chat-msg-reply-quote" style="background:rgba(0,0,0,.2);border-right:3px solid var(--gold);border-radius:6px;padding:5px 8px;margin-bottom:5px;font-size:11.5px;opacity:.85">${msg.reply_to_snippet.replace(/</g, '&lt;')}</div>`;
  }
  if (msg.msg_type === 'text') {
    inner += `<div>${(msg.content || '').replace(/</g, '&lt;')}</div>`;
  } else if (msg.msg_type === 'image') {
    inner += `<img src="${msg.media_url}" alt="عکس" style="max-width:100%;border-radius:8px">`;
  } else if (msg.msg_type === 'video') {
    inner += `<video src="${msg.media_url}" controls style="max-width:100%;border-radius:8px"></video>`;
  } else if (msg.msg_type === 'audio') {
    inner += `<audio src="${msg.media_url}" controls style="width:220px"></audio>`;
  }
  const time = new Date(msg.created_at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
  bubble.innerHTML = inner + `<div class="chat-msg-time">${time}</div>`;

  attachAdminSwipeToReply(bubble, row, msg);

  if (isAdmin) { row.appendChild(replyIcon); row.appendChild(bubble); }
  else { row.appendChild(bubble); row.appendChild(replyIcon); }
  return row;
}

function attachAdminSwipeToReply(bubble, row, msg) {
  let startX = 0, dx = 0, dragging = false;
  const threshold = 46;
  bubble.addEventListener('pointerdown', (e) => { dragging = true; startX = e.clientX; bubble.setPointerCapture(e.pointerId); });
  bubble.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    const clamped = Math.max(-70, Math.min(70, dx));
    bubble.style.transform = `translateX(${clamped}px)`;
    row.classList.toggle('swiping', Math.abs(clamped) > 12);
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    bubble.style.transform = '';
    row.classList.remove('swiping');
    if (Math.abs(dx) > threshold) setAdminReplyTarget(msg);
    dx = 0;
  };
  bubble.addEventListener('pointerup', endDrag);
  bubble.addEventListener('pointercancel', endDrag);
  bubble.addEventListener('pointerleave', () => { if (dragging) endDrag(); });
}

window.openChatThread = async function (convId, name, phone) {
  currentThreadId = convId;
  cancelAdminReply();

async function loadThreadMessages() {
  const box = document.getElementById('chat-thread-messages');
  box.innerHTML = '';
  try {
    const { data, error } = await sb.from('chat_messages')
      .select('*')
      .eq('conversation_id', currentThreadId)

    if (error) throw error;

    box.scrollTop = box.scrollHeight;
  } catch (e) {

function subscribeAdminChat() {
  if (adminChatChannel) sb.removeChannel(adminChatChannel);
  adminChatChannel = sb.channel('admin-chat-' + currentThreadId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      filter: 'conversation_id=eq.' + currentThreadId
    }, (payload) => {
      const box = document.getElementById('chat-thread-messages');
      box.appendChild(renderAdminMsg(payload.new));
      box.scrollTop = box.scrollHeight;
    })
    .subscribe();

  const input = document.getElementById('chat-thread-text-input');

  const replyData = adminReplyingTo ? { reply_to_id: adminReplyingTo.id, reply_to_snippet: adminReplyingTo.snippet } : {};
  cancelAdminReply();
  try {
    await sb.from('chat_messages').insert({
      conversation_id: currentThreadId, sender: 'admin', msg_type: 'text', content: text, ...replyData
    });
    await sb.from('chat_conversations').update({ last_message_at: new Date().toISOString() }).eq('id', currentThreadId);

window.handleAdminChatFileUpload = async function (files) {
  if (!files || !files.length || !currentThreadId) return;
  const file = files[0];
  const kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'audio';
  const replyData = adminReplyingTo ? { reply_to_id: adminReplyingTo.id, reply_to_snippet: adminReplyingTo.snippet } : {};
  cancelAdminReply();
  try {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `admin/${currentThreadId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error: upErr } = await sb.storage.from('chat-media').upload(path, file);
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('chat-media').getPublicUrl(path);
    await sb.from('chat_messages').insert({
      conversation_id: currentThreadId, sender: 'admin', msg_type: kind, media_url: pub.publicUrl, media_path: path, ...replyData
    });
    await sb.from('chat_conversations').update({ last_message_at: new Date().toISOString() }).eq('id', currentThreadId);
  } catch (e) {
    toast('خطا در ارسال فایل: ' + e.message, 'error');
  }
  document.getElementById('chat-thread-file-input').value = '';
};

async function savePost(statusOverride) {
  const id = document.getElementById('post-id').value;
  const status = statusOverride || document.getElementById('post-status').value;
  const title = document.getElementById('post-title').value;

  const seo_data = {
    title: document.getElementById('post-seo-title').value || title,
    description: document.getElementById('post-seo-desc').value,
    keyword: document.getElementById('post-seo-kw').value,
    canonical: document.getElementById('post-seo-canonical').value,
    og_title: document.getElementById('post-og-title').value || title,
    og_desc: document.getElementById('post-og-desc').value,
    noindex: document.getElementById('post-noindex').checked
  };

  const data = {
    title,
    slug: document.getElementById('post-slug').value || title.toLowerCase().replace(/\s+/g,'-'),
    excerpt: document.getElementById('post-excerpt').value,
    content: document.getElementById('post-content').value,
    category: document.getElementById('post-category').value,
    tags: document.getElementById('post-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
    status,
    seo_data,
    updated_at: new Date().toISOString()
  };

  if (status === 'published' && !data.published_at) {
    data.published_at = new Date().toISOString();
  }

  try {
    if (id) {
      const { error } = await sb.from('blog_posts').update(data).eq('id', id);
      if (error) throw error;
    } else {
      data.created_at = new Date().toISOString();
      const { error } = await sb.from('blog_posts').insert(data);
      if (error) throw error;
    }
    toast(status === 'published' ? '🚀 مقاله منتشر شد' : '💾 پیش‌نویس ذخیره شد');
    cancelPost();
    loadPosts();
  } catch(e) {
    toast('خطا: ' + e.message, 'error');
  }
}

async function togglePublish(id, currentStatus) {
  const newStatus = currentStatus === 'published' ? 'draft' : 'published';
  const { error } = await sb.from('blog_posts').update({
    status: newStatus,
    published_at: newStatus === 'published' ? new Date().toISOString() : null
  }).eq('id', id);
  if (error) toast('خطا: ' + error.message, 'error');
  else { toast(newStatus === 'published' ? '🚀 منتشر شد' : '✅ مخفی شد'); loadPosts(); }
}

async function deletePost(id) {
  if (!confirm('آیا مطمئنید؟ مقاله حذف خواهد شد.')) return;
  const { error } = await sb.from('blog_posts').delete().eq('id', id);
  if (error) toast('خطا: ' + error.message, 'error');
  else { toast('✅ مقاله حذف شد'); loadPosts(); }
}

function previewPost() {
  const title = document.getElementById('post-title').value;
  const content = document.getElementById('post-content').value;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
    <title>${title}</title>
    <style>body{font-family:sans-serif;max-width:800px;margin:2rem auto;padding:1rem;line-height:1.8}
    h1,h2,h3{color:#222}code{background:#f3f3f3;padding:2px 6px;border-radius:4px}
    blockquote{border-right:4px solid #C9A84C;padding-right:1rem;color:#666;margin:1rem 0}</style>
    </head><body><h1>${title}</h1><hr>${content}</body></html>`);
}

// Editor helpers
function fmt(cmd) {
  const ta = document.getElementById('post-content');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const tags = { bold: ['<strong>','</strong>'], italic: ['<em>','</em>'] };
  const [o, c] = tags[cmd];
  ta.value = ta.value.substring(0, start) + o + sel + c + ta.value.substring(end);
}
function insertTag(tag) {
  const ta = document.getElementById('post-content');
  const pos = ta.selectionEnd;
  const insert = `\n<${tag}></${tag}>\n`;
  ta.value = ta.value.substring(0, pos) + insert + ta.value.substring(pos);
}
function insertLink() {
  const url = prompt('آدرس لینک:');
  if (!url) return;
  const ta = document.getElementById('post-content');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || 'متن لینک';
  ta.value = ta.value.substring(0, start) + `<a href="${url}">${sel}</a>` + ta.value.substring(end);
}
function insertList(type) {
  const ta = document.getElementById('post-content');
  const pos = ta.selectionEnd;
  ta.value = ta.value.substring(0, pos) + `\n<${type}>\n  <li>آیتم اول</li>\n  <li>آیتم دوم</li>\n</${type}>\n` + ta.value.substring(pos);
}
